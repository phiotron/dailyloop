# CI iOS: build bản simulator (không ký) + mở app trên iOS Simulator, chụp màn hình, kiểm app còn sống.
# Repo private → phút macOS tính ×10 quota: chỉ chạy khi push nhánh main có đổi code, hoặc chạy tay.
# Máy làm việc là Windows, không có Mac/iPhone → đây là nơi DUY NHẤT build + thử iOS (fact may-windows-build-ios).
# CHƯA có integration test: cần gói `integration_test` trong pubspec (xem notes/2026-11-04-ios-ci.md).
name: iOS

# Tiết kiệm phút Actions (luật xưởng WORKFLOW §7, 2026-11-05): không chạy trên `dev`; push `main` chỉ kiểm;
# build chỉ khi tag `v*` hoặc chạy tay.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.phiotron.dailyloop

jobs:
  ios-simulator:
    name: Build + smoke test iOS Simulator
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Phiên bản công cụ
        run: |
          mkdir -p ci-logs
          { xcodebuild -version; flutter --version; xcrun simctl list runtimes; } 2>&1 | tee ci-logs/versions.txt

      - name: Cài gói
        run: flutter pub get

      - name: Kiểm Info.plist, PrivacyInfo, entitlements, âm chuông
        run: |
          plutil -lint ios/Runner/Info.plist ios/Runner/PrivacyInfo.xcprivacy ios/Runner/Runner.entitlements
          # Tên hiển thị chốt là "Orbiday" (bundle id vẫn com.phiotron.dailyloop).
          test "$(plutil -extract CFBundleDisplayName raw ios/Runner/Info.plist)" = "Orbiday"
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw ios/Runner/Info.plist)" = "false"
          test "$(plutil -extract NSPrivacyTracking raw ios/Runner/PrivacyInfo.xcprivacy)" = "false"
          test "$(/usr/libexec/PlistBuddy -c "Print :com.apple.developer.usernotifications.time-sensitive" ios/Runner/Runner.entitlements)" = "true"
          # Chỉ chạy dọc (SPEC mục 5): đúng một hướng, không khai UIBackgroundModes (nhắc giờ không cần).
          test "$(plutil -extract UISupportedInterfaceOrientations raw ios/Runner/Info.plist)" = "1"
          if grep -q "UIBackgroundModes" ios/Runner/Info.plist; then echo "Info.plist khai UIBackgroundModes"; exit 1; fi
          # Không xin quyền hệ thống nào ngoài thông báo (xin lúc chạy, không có khoá trong Info.plist).
          if grep -q "UsageDescription" ios/Runner/Info.plist; then echo "Info.plist có xin quyền"; exit 1; fi
          # Âm chuông iOS: dưới 30 giây (giới hạn của iOS cho âm thông báo tùy chỉnh).
          afinfo ios/Runner/alarm.wav | tee ci-logs/alarm-afinfo.txt
          SECS=$(afinfo ios/Runner/alarm.wav | awk '/estimated duration/ {print int($3)}')
          test "$SECS" -lt 30

      - name: Build iOS simulator (debug, không ký)
        run: |
          set -o pipefail
          flutter build ios --simulator --debug 2>&1 | tee ci-logs/build-ios-simulator.log
          APP=build/ios/iphonesimulator/Runner.app
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/alarm.wav"
          plutil -p "$APP/Info.plist" | tee ci-logs/built-info-plist.txt
          codesign -d --entitlements - "$APP" 2>&1 | tee ci-logs/built-entitlements.txt || true
          ls "$APP/Frameworks" | tee ci-logs/frameworks.txt

      - name: Khởi động iOS Simulator (iPhone)
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          rts = sorted((r for r in d if "iOS" in r), key=lambda r: [int(x) for x in r.split("iOS-")[-1].split("-")], reverse=True)
          for r in rts:
              for dev in d[r]:
                  if dev["name"].startswith("iPhone") and dev.get("isAvailable", True):
                      print(dev["udid"]); sys.exit(0)
          sys.exit(1)')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID" | tee ci-logs/simulator.txt
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Cài + mở app, chụp màn hình
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" "$BUNDLE_ID" | tee ci-logs/launch.txt
          sleep 20
          xcrun simctl io "$UDID" screenshot ci-logs/launch.png
          # App phải còn sống sau 20 giây (không văng khi mở DB / khởi tạo thông báo).
          xcrun simctl spawn "$UDID" launchctl list | grep "$BUNDLE_ID"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true

      - name: Log hệ thống simulator (khi lỗi)
        if: failure() && steps.sim.outputs.udid != ''
        run: |
          xcrun simctl spawn ${{ steps.sim.outputs.udid }} log show --last 10m --style compact \
            --predicate 'process == "Runner"' > ci-logs/simulator-runner.log 2>&1 || true

      - name: Tải log + ảnh chụp
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-logs
          path: ci-logs/
          retention-days: 14
