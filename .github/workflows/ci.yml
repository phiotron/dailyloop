# CI Dart/Android: phân tích + unit/widget test trên Ubuntu (rẻ), chạy mọi push và PR.
# Ghim Flutter 3.47.8 cho khớp máy phát triển (D-003). iOS ở ios.yml (macOS, chỉ nhánh main).
name: CI
# Tiết kiệm phút Actions (luật xưởng WORKFLOW §7, 2026-11-05): không chạy trên `dev`; push `main` chỉ kiểm;
# build chỉ khi tag `v*` hoặc chạy tay.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'store/**', 'design/**', 'notes/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze + test (Dart)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true
      - name: Cài gói
        run: flutter pub get
      - name: Phân tích
        run: flutter analyze
      - name: Test
        run: flutter test
